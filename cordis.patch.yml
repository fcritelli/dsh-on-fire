# Patch of the `dsh-on-fire` bundle, applied as ONE layer over the profile.
#
# A bundle layer is applied BEFORE the user's patch
# (`~/.dsh/profiles/<profile>/cordis.patch.yml`) and before the DSH home patch
# (`~/.dsh/cordis.patch.yml`). So everything here is a **default**: to change any
# value, the user targets the row by id in a later layer and the last write wins.
#
# Careful when targeting by id: a patch replaces the row's WHOLE `config`; it does not merge.
# To change only graphify's `command`, you have to rewrite the entire block.

- insert:
    # ── the bundle's improvements ────────────────────────────────────────────────
    # Prompt rules + skills. Each toggle is independent; see docs/IMPROVEMENTS.md.
    - id: on-fire
      name: 'dsh-on-fire'
      config:
        language: true
        waiting: true
        graphify: true
        adhd: true
        asking: true
        skills: true
        disabledSkills: []

    # ── MCP servers ────────────────────────────────────────────────────────
    # The `command`s below are portable on purpose (name on the PATH, no absolute
    # path and no user). The DSH host's PATH is usually minimal, so on
    # some machines the name does not resolve: in that case `install/adjust-paths.sh`
    # writes an override with the absolute path in your user layer.
    #
    # `failOnStartupError: false` keeps DSH standing when the server does not come up —
    # the cost is failing silently, so check the tool list after installing.

    # Code knowledge graph. The tools appear as `mcp__graphify__*` and
    # work in multi-project mode: every call receives `project_path` with the absolute
    # path of the workspace root. Without `project_path` the call fails on purpose.
    - id: mcp-graphify
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: graphify
        transport: stdio
        command: graphify-mcp
        args: ['--transport', 'stdio']
        toolCallTimeoutMs: 120000
        failOnStartupError: false

    # Support for LGPD compliance (Law 13.709/2018). Tools at `mcp__lgpd__*`.
    # Auxiliary: it does NOT replace legal advice.
    - id: mcp-lgpd
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: lgpd
        transport: stdio
        command: npx
        args: ['-y', '@lordmendes/lgpd-mcp']
        toolCallTimeoutMs: 60000
        failOnStartupError: false
